name: Client Tests

on:
  push:
    branches: [main]
    paths:
      - "apps/client/**"
      - "packages/db/**"
      - "drizzle.config.ts"
      - "drizzle/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/client-tests.yml"
  pull_request:
    paths:
      - "apps/client/**"
      - "packages/db/**"
      - "drizzle.config.ts"
      - "drizzle/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/client-tests.yml"

jobs:
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter client run check

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgresql://admin:secret@localhost:5432/test
      BETTER_AUTH_SECRET: ci-e2e-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ci-e2e-webhook-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Get installed Playwright version
        id: playwright-version
        working-directory: apps/client
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/client
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/client
        run: pnpm exec playwright install-deps chromium

      - name: Apply database migrations
        run: pnpm exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Run e2e tests
        run: pnpm --filter client run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/client/playwright-report/
          retention-days: 7
