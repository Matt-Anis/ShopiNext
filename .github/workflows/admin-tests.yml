name: Admin Tests

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/db/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/admin-tests.yml"
  pull_request:
    paths:
      - "apps/admin/**"
      - "packages/db/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/admin-tests.yml"

jobs:
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter admin run check
