name: Admin Tests

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/db/**"
      - "drizzle.config.ts"
      - "drizzle/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/admin-tests.yml"
  pull_request:
    paths:
      - "apps/admin/**"
      - "packages/db/**"
      - "drizzle.config.ts"
      - "drizzle/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/admin-tests.yml"

jobs:
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter admin run check

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgresql://admin:secret@postgres:5432/test
      BETTER_AUTH_SECRET: ci-e2e-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3001
      # Emails are sent fire-and-forget (better-auth's runInBackgroundOrAwait
      # just logs a failure, it doesn't fail the request), so a dummy key is
      # enough to satisfy Resend's constructor — no real account needed.
      RESEND_API_KEY: re_ci_dummy_key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Run e2e tests
        run: pnpm --filter admin run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin/playwright-report/
          retention-days: 7
