services:
  db:
    image: postgres:16
    container_name: store_db
    restart: unless-stopped
    environment:
      # Must not match any schema name in packages/db (e.g. "admin", "public") —
      # Postgres's default search_path is "$user", public, so a role named the
      # same as a schema silently shadows public for unqualified CREATE TABLE.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  s3:
    image: chrislusf/seaweedfs
    container_name: store_s3
    restart: unless-stopped
    command: "server -s3 -dir=/data -s3.port=8333"
    ports:
      - "8333:8333"
    volumes:
      - s3_data:/data

volumes:
  postgres_data:
  s3_data:
