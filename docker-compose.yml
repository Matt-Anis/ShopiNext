services:
  db:
    image: postgres:16
    container_name: store_db
    restart: unless-stopped
    environment:
      # Must not match any schema name in packages/db (e.g. "admin", "public") —
      # Postgres's default search_path is "$user", public, so a role named the
      # same as a schema silently shadows public for unqualified CREATE TABLE.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
